          {% set v = state_attr('sensor.fault_flag_6_map','Secondary_anti_freeze') %}
          {{ v in ['on','1',1,True] }}

      - name: "The heat sink temperature is too high"
        unique_id: the_heat_sink_temperature_is_too_high
        device_class: problem
        state: >-
          {% set v = state_attr('sensor.low_8bit_inverter_fault_map','The_heat_sink_temperature_is_too_high') %}
          {{ v in ['on','1',1,True] }}

      - name: "The peak current of the press is too high"
        unique_id: the_peak_current_of_the_press_is_too_high
        device_class: problem
        state: >-
          {% set v = state_attr('sensor.high_8bit_inverter_fault_map','The_peak_current_of_the_press_is_too_high') %}
          {{ v in ['on','1',1,True] }}

      - name: "Vacation mode"
        unique_id: vacation_mode
        icon: mdi:airplane
        state: >
          {% set v = state_attr('sensor.control_flags_2_map','vacation_mode') %}
          {{ v is true }}


      - name: "EVU signal"
        unique_id: evu_signal
        device_class: connectivity
        icon: mdi:close-network-outline
        # If sensor.status_check cannot be read, int(0) would give 0 and the
        # inverted bits (linkage, EVU, SG) would read "on". A read error now shows
        # as unavailable instead.
        availability: "{{ has_value('sensor.status_check') }}"
        state: >-
          {% set v = state_attr('sensor.status_check_map','EVU_signal') %}
          {{ v in ['on','1',1,True] }}

      - name: "High pressure switch"
        unique_id: high_pressure_switch
        device_class: problem
        state: >-
          {% set v = state_attr('sensor.status_check_map','High_pressure_switch') %}
          {{ v in ['on','1',1,True] }}

      - name: "Linkage switch"
        unique_id: linkage_switch
        device_class: connectivity
        icon: mdi:close-network-outline
        # If sensor.status_check cannot be read, int(0) would give 0 and the
        # inverted bits (linkage, EVU, SG) would read "on". A read error now shows
        # as unavailable instead.
        availability: "{{ has_value('sensor.status_check') }}"
        state: >-
          {% set v = state_attr('sensor.status_check_map','Linkage_switch') %}
          {{ v in ['on','1',1,True] }}

      - name: "Low pressure switch"
        unique_id: low_pressure_switch
        device_class: problem
        state: >-
          {% set v = state_attr('sensor.status_check_map','Low_pressure_switch') %}
          {{ v in ['on','1',1,True] }}

      - name: "SG signal"
        unique_id: sg_signal
        device_class: connectivity
        icon: mdi:close-network-outline
        # If sensor.status_check cannot be read, int(0) would give 0 and the
        # inverted bits (linkage, EVU, SG) would read "on". A read error now shows
        # as unavailable instead.
        availability: "{{ has_value('sensor.status_check') }}"
        state: >-
          {% set v = state_attr('sensor.status_check_map','SG_signal') %}
          {{ v in ['on','1',1,True] }}

      - name: "Water flow switch"
        unique_id: water_flow_switch
        device_class: problem
        state: >-
          {% set v = state_attr('sensor.status_check_map','Water_flow_switch') %}
          {{ v in ['on','1',1,True] }}

      - name: "Heating"
        unique_id: heating
        state: >
          {{ is_state_attr('sensor.output_flag_2_map', '3-way_valve', 'Heating') 
             and is_state('binary_sensor.compressor', 'on') 
             and is_state('binary_sensor.defrosting', 'off') }}

      - name: "Domestic hot water"
        unique_id: domestic_hotwater
        state: >
          {{ is_state_attr('sensor.output_flag_2_map', '3-way_valve', 'DHW') 
             and is_state('binary_sensor.compressor', 'on') 
             and is_state('binary_sensor.defrosting', 'off') }}

      # One line for the dashboard: on while any fault is active, off (and the
      # text gone) when all are clear. 'latest' = the fault that came on last,
      # '(+N)' if several. Same list as the fault notifications below.
      - name: "Heat pump fault"
        unique_id: heat_pump_fault
        device_class: problem
        icon: mdi:alert
        state: >-
          {% set active = expand([
               'binary_sensor.ac_input_overcurrent',
               'binary_sensor.ac_input_phase_loss',
               'binary_sensor.ac_input_voltage_is_low',
               'binary_sensor.communication_failure',
               'binary_sensor.dc_bus_voltage_is_high',
               'binary_sensor.dc_bus_voltage_is_low',
               'binary_sensor.er03_water_flow_failure',
               'binary_sensor.er05_high_pressure_fault',
               'binary_sensor.er06_low_pressure_fault',
               'binary_sensor.er10_frequency_conversion_module_communication_failure',
