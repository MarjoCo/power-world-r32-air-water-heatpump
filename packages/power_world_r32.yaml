          DC_bus_voltage_is_low: "{% if states('sensor.low_8bit_inverter_fault') | int(0) | bitwise_and(16) %}on{% else %}off{% endif %}"
          DC_bus_voltage_is_high: "{% if states('sensor.low_8bit_inverter_fault') | int(0) | bitwise_and(32) %}on{% else %}off{% endif %}"
          The_heat_sink_temperature_is_too_high: "{% if states('sensor.low_8bit_inverter_fault') | int(0) | bitwise_and(64) %}on{% else %}off{% endif %}"
          Heat_sink_temperature_failure: "{% if states('sensor.low_8bit_inverter_fault') | int(0) | bitwise_and(128) %}on{% else %}off{% endif %}"

      - name: "High 8bit inverter fault map"
        unique_id: high_8bit_inverter_fault_map
        state: "{{ states('sensor.high_8bit_inverter_fault') | int(0) }}"
        state_class: measurement
        attributes:
          Communication_failure: "{% if states('sensor.high_8bit_inverter_fault') | int(0) | bitwise_and(1) %}on{% else %}off{% endif %}"
          AC_input_phase_loss: "{% if states('sensor.high_8bit_inverter_fault') | int(0) | bitwise_and(2) %}on{% else %}off{% endif %}"
          AC_input_overcurrent: "{% if states('sensor.high_8bit_inverter_fault') | int(0) | bitwise_and(4) %}on{% else %}off{% endif %}"
          AC_input_voltage_is_low: "{% if states('sensor.high_8bit_inverter_fault') | int(0) | bitwise_and(8) %}on{% else %}off{% endif %}"
          IPM_temperature_is_too_high: "{% if states('sensor.high_8bit_inverter_fault') | int(0) | bitwise_and(16) %}on{% else %}off{% endif %}"
          High_voltage_fault: "{% if states('sensor.high_8bit_inverter_fault') | int(0) | bitwise_and(32) %}on{% else %}off{% endif %}"
          The_peak_current_of_the_press_is_too_high: "{% if states('sensor.high_8bit_inverter_fault') | int(0) | bitwise_and(64) %}on{% else %}off{% endif %}"
          PFC_module_over_temperature: "{% if states('sensor.high_8bit_inverter_fault') | int(0) | bitwise_and(128) %}on{% else %}off{% endif %}"

      - name: "Status check map"
        unique_id: status_check_map
        # If sensor.status_check cannot be read, int(0) would give 0 and the
        # inverted bits (linkage, EVU, SG) would read "on". A read error now shows
        # as unavailable instead.
        availability: "{{ has_value('sensor.status_check') }}"
        state: "{{ states('sensor.status_check') | int(0) }}"
        state_class: measurement
        attributes:
          High_pressure_switch: "{% if states('sensor.status_check') | int(0) | bitwise_and(1) %}on{% else %}off{% endif %}"
          Low_pressure_switch: "{% if states('sensor.status_check') | int(0) | bitwise_and(2) %}on{% else %}off{% endif %}"
          Water_flow_switch: "{% if states('sensor.status_check') | int(0) | bitwise_and(4) %}on{% else %}off{% endif %}"
          Linkage_switch: "{% if states('sensor.status_check') | int(0) | bitwise_and(8) %}off{% else %}on{% endif %}"
          bit4: "{% if states('sensor.status_check') | int(0) | bitwise_and(16) %}on{% else %}off{% endif %}"
          EVU_signal: "{% if states('sensor.status_check') | int(0) | bitwise_and(32) %}off{% else %}on{% endif %}"
          SG_signal: "{% if states('sensor.status_check') | int(0) | bitwise_and(64) %}off{% else %}on{% endif %}"
          bit7: "{% if states('sensor.status_check') | int(0) | bitwise_and(128) %}on{% else %}off{% endif %}"

  # Heat pump power (register 0x0000, bit 0). The same register also holds the
  # A41, manual frequency, C01, B01 and A45 settings, so the switch reads the
  # current value, changes bit 0 only, and writes only when the register has been
  # read and the value really changes (the memory chip wears with every write).
  - switch:
      - name: "U-Energy on/off"
        unique_id: u_energy_on_off
        icon: mdi:power
        availability: "{{ states('sensor.parameter_flags_1') | is_number }}"
        state: "{{ states('sensor.parameter_flags_1') | int(0) | bitwise_and(1) > 0 }}"
        turn_on:
          - variables:
              current: "{{ states('sensor.parameter_flags_1') | int(-1) }}"
          - if:
              - condition: template
                value_template: "{{ current >= 0 and current | bitwise_and(1) == 0 }}"
            then:
              - action: modbus.write_register
                data:
                  hub: ultimate
                  unit: 1
                  address: 0
                  value: "{{ current + 1 }}"
              - action: homeassistant.update_entity
                target:
                  entity_id: sensor.parameter_flags_1
        turn_off:
          - variables:
              current: "{{ states('sensor.parameter_flags_1') | int(-1) }}"
          - if:
              - condition: template
                value_template: "{{ current >= 0 and current | bitwise_and(1) == 1 }}"
            then:
              - action: modbus.write_register
                data:
                  hub: ultimate
                  unit: 1
                  address: 0
                  value: "{{ current - 1 }}"
              - action: homeassistant.update_entity
                target:
                  entity_id: sensor.parameter_flags_1

automation:
  - id: ultimate_handle_setpoint_temperature_change
    alias: Power World Handle Setpoint Temperature Change
    description: ''
    triggers:
      - trigger: state
        entity_id:
          - sensor.heating_temperature_diff
          - sensor.dhw_temperature_diff
          - sensor.heating_set_temperature
          - sensor.hot_water_set_temperature
          - sensor.cooling_set_temperature
          - sensor.vacation_set_temperature
    conditions:
      - condition: template
        value_template: >
          {{ trigger.to_state is not none
            and trigger.to_state.state not in ['unknown', 'unavailable', '', None]
            and (trigger.to_state.state | float(none)) is not none
            and (trigger.to_state.state | float) > -50
            and (trigger.to_state.state | float) < 100 }}
    actions:
      - action: input_number.set_value
        data:
          entity_id: input_number.{{ trigger.to_state.object_id }}
          value: '{{ trigger.to_state.state }}'
    max: 20
    mode: queued



  - id: ultimate_handle_work_mode_option_change
    alias: Power World Handle Work Mode option change for UI
    # Variables are computed only after the condition, so an 'unavailable'
    # reading (e.g. during a Modbus reload) cannot break the automation. This only
    # syncs the display; the device is written only on a user change (below).
    triggers:
      - trigger: state
        entity_id: sensor.work_mode

    conditions:
      - condition: template
        value_template: >
          {{ trigger.to_state is not none
            and trigger.to_state.state not in ['unknown','unavailable','',None]
            and (trigger.to_state.state | int(default=-1)) != -1 }}

    actions:
      - variables:
          # input_select.work_mode
          input_select_id: "input_select.{{ trigger.to_state.object_id }}"
          # sensor.work_mode -> int (0-4)
          idx: "{{ trigger.to_state.state | int(0) }}"
      - action: input_select.select_option
        target:
          entity_id: "{{ input_select_id }}"
        data:
          option: >
            {{ state_attr(input_select_id, 'options')[ idx ] }}

    mode: queued
    max: 20


  - id: ultimate_handle_operation_mode_set_to_ui
    alias: Power World Handle operation mode set to UI
    # Shows a mode change made on the heat pump's own panel in the UI. Without
    # this it would appear only at the next Home Assistant start.
    #
    # ZERO GUARD: sensor.control_flags_1_map occasionally drops to 0 for a few
    # seconds. Both mode bits then read off and the template below would compute
    # 'Smart', which would make 'Power World Update Operation Mode from UI' write
    # register 1 and really change the heat pump's mode because of a read error.
    # Values > 0 pass, 0 does not.
    #
    # No loop: the device is written only when a person changes the value in the
    # UI and the new value differs, so syncing the UI from the device never
    # causes a Modbus write.
    triggers:
      - trigger: state
        entity_id: sensor.control_flags_1_map
    conditions:
      - condition: template
        value_template: >
          {{ trigger.to_state is not none
            and trigger.to_state.state not in ['unknown', 'unavailable', '', None]
            and (trigger.to_state.state | string) != ''
            and (trigger.to_state.state | int(0)) > 0
          }}

    actions:
      - action: input_select.select_option
        data:
          option: >
            {% if state_attr('sensor.control_flags_1_map', 'Powerful_mode') == 'on' %}
              Powerful
            {% elif state_attr('sensor.control_flags_1_map', 'Silent_mode') == 'on' %}
              Silent
            {% else %}
              Smart
            {% endif %}
        target:
          entity_id: input_select.operation_mode
    mode: single
    
  - id: ultimate_heat_pump_error
    alias: Power World Heat pump Error
    triggers:
      - entity_id:
          - binary_sensor.high_pressure_switch
          - binary_sensor.er05_high_pressure_fault
          - binary_sensor.er10_frequency_conversion_module_communication_failure
          - binary_sensor.er12_exhaust_temp_too_high
          - binary_sensor.er14_water_tank_temp_sensor_fault
          - binary_sensor.er15_water_inlet_temp_sensor_fault
          - binary_sensor.er16_evaporator_coil_temp_sensor_fault
          - binary_sensor.er18_exhaust_temp_fault
          - binary_sensor.er21_ambiet_temp_sensor_fault
          - binary_sensor.er23_cooling_outlet_water_temp_supercooling_protection
          - binary_sensor.er27_outlet_water_temp_sensor_fault
          - binary_sensor.er29_return_gas_temp_sensor_fault
          - binary_sensor.er32_overheating_water_outlet
          - binary_sensor.er33_coil_temp_too_high
          - binary_sensor.er42_cooling_coil_temp_sensor_failure
          - binary_sensor.er64_dc_fan_1_fault
          - binary_sensor.er69_too_low_pressure_protection
          - binary_sensor.ipm_overcurrent
          - binary_sensor.press_syncronization_abnormality
          - binary_sensor.press_output_phase_loss
          - binary_sensor.dc_bus_voltage_is_high
          - binary_sensor.dc_bus_voltage_is_low
          - binary_sensor.heat_sink_temperature_failure
          - binary_sensor.the_heat_sink_temperature_is_too_high
          - binary_sensor.communication_failure
          - binary_sensor.ac_input_phase_loss
          - binary_sensor.ac_input_overcurrent
          - binary_sensor.ac_input_voltage_is_low
          - binary_sensor.ipm_temperature_is_too_high
          - binary_sensor.high_voltage_fault
          - binary_sensor.the_peak_current_of_the_press_is_too_high
          - binary_sensor.pfc_module_over_temperature
        trigger: state
        from: 'off'
        to: 'on'
        for:
          hours: 0
          minutes: 0
          seconds: 6
    conditions:
      # No start-up delay: a fault that is active when Home Assistant starts is
      # reported once after the first read (the sensors go off -> on). A delay
      # would hide such a fault for good, as no new off -> on follows.
      - condition: template
        value_template: >
          {{ trigger.to_state is not none
            and trigger.to_state.state not in ['unknown', 'unavailable', '', None] }}
    actions:
      - action: notify.persistent_notification
        data:
          message: '{{ trigger.to_state.name }}'
          title: Heat Pump Fault
      - action: notify.notify
        data:
          message: '{{ trigger.to_state.name }}'
          title: Heat Pump Fault
    mode: parallel
  
  - id: ultimate_update_vacation_mode_from_control_flags_2_map
    alias: Power World Update Vacation Mode from Control Flags 2 Map
    # WRITES ONLY ON A USER CHANGE. Syncing from the device (Power World Sync
    # Vacation Mode Input Boolean) changes the boolean in an automation context,
    # so it never writes. The flag register must also have been read as a number.
    triggers:
      - entity_id: input_boolean.vacation_mode
        trigger: state
        from: 'off'
        to: 'on'
      - entity_id: input_boolean.vacation_mode
        trigger: state
        from: 'on'
        to: 'off'
    conditions:
      - condition: template
        alias: Changed by a person in the UI, not by an automation
        value_template: '{{ trigger.to_state.context.user_id is not none }}'
      - condition: template
        value_template: >
          {{ states('sensor.control_flags_2_map') | int(-1) >= 0 }}
      - condition: template
        value_template: >
          {{ states('binary_sensor.vacation_mode') in ['on', 'off']
             and states('input_boolean.vacation_mode') != states('binary_sensor.vacation_mode') }}
    actions:
      - variables:
          bit3: '{{ 1 if is_state_attr(''sensor.control_flags_2_map'', ''bit3'', ''1'') else 0 }}'
          bit4: '{{ 1 if is_state_attr(''sensor.control_flags_2_map'', ''bit4'', ''1'') else 0 }}'
          bit5: '{{ 1 if is_state_attr(''sensor.control_flags_2_map'', ''bit5'', ''1'') else 0 }}'
          bit6: '{{ 1 if is_state_attr(''sensor.control_flags_2_map'', ''bit6'', ''1'') else 0 }}'
          bit7: '{{ 1 if is_state_attr(''sensor.control_flags_2_map'', ''bit7'', ''1'') else 0 }}'
          main_valve_mode: '{{ 1 if is_state_attr(''sensor.control_flags_2_map'', ''Main_valve_mode_selection'', ''1'') else 0 }}'
          smart_grid: '{{ 1 if is_state_attr(''sensor.control_flags_2_map'', ''Smart_grid'', ''1'') else 0 }}'
          vacation_mode: '{{ 1 if is_state(''input_boolean.vacation_mode'', ''on'') else 0 }}'
      - variables:
          new_value: '{{ main_valve_mode }}'
      - variables:
          new_value: '{{ new_value + (vacation_mode) * 2 }}'
      - variables:
          new_value: '{{ new_value + (smart_grid) * 4 }}'
      - variables:
          new_value: '{{ new_value + (bit3) * 8 }}'
      - variables:
          new_value: '{{ new_value + (bit4) * 16 }}'
      - variables:
          new_value: '{{ new_value + (bit5) * 32 }}'
      - variables:
          new_value: '{{ new_value + (bit6) * 64 }}'
      - variables:
          new_value: '{{ new_value + (bit7) * 128 }}'
      - variables:
          current_value: "{{ states('sensor.control_flags_2_map') | int(-1) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: '{{ current_value >= 0 and new_value | int != current_value }}'
            sequence:
              - action: modbus.write_register
                data:
                  address: 2
                  hub: ultimate
                  unit: 1
                  value: '{{ new_value }}'
    mode: single
  
  - id: ultimate_critical_failure_notification
    alias: Power World Critical failure Notification
    triggers:
      - entity_id:
          - binary_sensor.er03_water_flow_failure
          - binary_sensor.er06_low_pressure_fault
          - binary_sensor.secondary_anti_freeze
        trigger: state
        from: 'off'
        to: 'on'
        for:
          hours: 0
          minutes: 0
          seconds: 6
    conditions:
      # No start-up delay: a fault that is active when Home Assistant starts is
      # reported once after the first read (the sensors go off -> on). A delay
      # would hide such a fault for good, as no new off -> on follows.
      - condition: template
        value_template: >
          {{ trigger.to_state is not none
            and trigger.to_state.state not in ['unknown', 'unavailable', '', None] }}
    actions:
      - action: notify.notify
        data:
          data:
            push:
              critical: 1
              interruption-level: critical
              sound: alarm.wav
              volume: 1
          message: 'Critical Alert: {{ trigger.to_state.name }}'
          title: Critical Alert!
      - action: notify.persistent_notification
        data:
          message: 'Critical Alert: {{ trigger.to_state.name }}'
          title: Critical Alert!
    mode: single  
  - id: ultimate_update_operation_mode_from_ui
    alias: Power World Update Operation Mode from UI
    # WRITES ONLY ON A USER CHANGE. The start-up sync could set 'Smart' before
    # the flag register had been read; if the register was read right after, this
    # would have written a new value and switched off the device's silent mode.
    # Now: only a person's change, and the flag register must be read and > 0
    # (the same zero guard as the display sync).
    triggers:
      - trigger: state
        entity_id: input_select.operation_mode
    mode: single
    conditions:
      - condition: template
        value_template: >
          {{ trigger.to_state is not none
            and trigger.to_state.state not in ['unknown', 'unavailable', '', None]
            and (trigger.to_state.state | string) != ''
          }}
      - condition: template
        alias: Changed by a person in the UI, not by an automation
        value_template: '{{ trigger.to_state.context.user_id is not none }}'
      - condition: template
        alias: Flag register read and not the 0 glitch
        value_template: "{{ states('sensor.control_flags_1_map') | int(0) > 0 }}"
    actions:
      - variables:
          silent_mode: "{{ 1 if is_state('input_select.operation_mode', 'Silent') else 0 }}"
          smart_mode: "{{ 1 if is_state('input_select.operation_mode', 'Smart') else 0 }}"
          powerful_mode: "{{ 1 if is_state('input_select.operation_mode', 'Powerful') else 0 }}"
          auxiliary_electronic_expansion_valve: "{{ 1 if state_attr('sensor.control_flags_1_map', 'Auxiliary_electronic_expansion_valve') == 'Exhaust super heat' else 0 }}"
          bit7: "{{ 1 if state_attr('sensor.control_flags_1_map', 'bit7') == 'on' else 0 }}"
          co2_pressure_sensor: "{{ 1 if state_attr('sensor.control_flags_1_map', 'Co2-pressure_sensor') == 'Valid' else 0 }}"
          cooling_auxiliary_allowed: "{{ 1 if state_attr('sensor.control_flags_1_map', 'Cooling_auxiliary_allowed') == 'Not allowed' else 0 }}"
          current_value: "{{ states('sensor.control_flags_1_map') | int(0) }}"
          heating_target_temp_adjustment: "{{ 1 if state_attr('sensor.control_flags_1_map', 'Heating_Target_temp_adjustment') == 'Enabled' else 0 }}"
          reduced_frequency: "{{ 1 if state_attr('sensor.control_flags_1_map', 'Reduced_frequency') == 'Fixed' else 0 }}"
          current_auxiliary_electronic_expansion_valve: "{{ (current_value // 8) % 2 }}"
          current_bit7: "{{ (current_value // 128) % 2 }}"
          current_co2_pressure_sensor: "{{ (current_value // 2) % 2 }}"
          current_cooling_auxiliary_allowed: "{{ (current_value // 4) % 2 }}"
          current_heating_target_temp_adjustment: "{{ (current_value // 64) % 2 }}"
          current_reduced_frequency: "{{ current_value % 2 }}"
          new_value: "{{ current_reduced_frequency + (current_co2_pressure_sensor * 2) + (current_cooling_auxiliary_allowed * 4) + (current_auxiliary_electronic_expansion_valve * 8) + (current_heating_target_temp_adjustment * 64) + (current_bit7 * 128) + (powerful_mode * 16) + (silent_mode * 32) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ current_value > 0 and new_value | int != current_value }}"
            sequence:
              - action: modbus.write_register
                data:
                  address: 1
                  hub: ultimate
                  unit: 1
                  value: "{{ new_value }}"

  - id: Ultimate_sync_vacation_mode_input_boolean
    alias: Power World Sync Vacation Mode Input Boolean
    # Only when the device state has been read (on/off). Otherwise an
    # 'unavailable' reading would fall to the default branch and turn the
    # boolean off.
    triggers:
      - trigger: state
        entity_id: binary_sensor.vacation_mode
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('binary_sensor.vacation_mode') in ['on', 'off'] }}"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.vacation_mode
                state: 'on'
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.vacation_mode
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.vacation_mode
    mode: single

  - id: ultimate_update_ui_on_startup
    alias: Power World Update UI on Startup
    triggers:
      - trigger: homeassistant
        event: start
    conditions: []
    # Waits until the device values have been read (at most 2 min) and sets each
    # display value only if its source has been read. An unread sensor.work_mode
    # would otherwise give 0 = DHW. Writing to the device also requires a user
    # change, so this sync never writes.
    actions:
      - wait_template: >
          {{ states('sensor.control_flags_1_map') | int(0) > 0
             and states('sensor.work_mode') | int(-1) >= 0 }}
        timeout: '00:02:00'
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ states('sensor.control_flags_1_map') | int(0) > 0 }}"
        then:
          - action: input_select.select_option
            data:
              option: >
                {% if state_attr('sensor.control_flags_1_map', 'Powerful_mode') == 'on' %}
                  Powerful
                {% elif state_attr('sensor.control_flags_1_map', 'Silent_mode') == 'on' %}
                  Silent
                {% else %}
                  Smart
                {% endif %}
            target:
              entity_id: input_select.operation_mode
      - if:
          - condition: template
            value_template: >
              {{ states('sensor.work_mode') | int(-1) >= 0
                 and states('sensor.work_mode') | int(-1) < state_attr('input_select.work_mode', 'options') | count }}
        then:
          - action: input_select.select_option
            data:
              option: "{{ state_attr('input_select.work_mode', 'options')[ states('sensor.work_mode') | int ] }}"
            target:
              entity_id: input_select.work_mode
      - repeat:
          for_each:
            - cooling_set_temperature
            - dhw_temperature_diff
            - heating_set_temperature
            - heating_temperature_diff
            - hot_water_set_temperature
            - vacation_set_temperature
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states('sensor.' ~ repeat.item) | is_number }}"
              then:
                - action: input_number.set_value
                  data:
                    entity_id: "input_number.{{ repeat.item }}"
                    value: "{{ states('sensor.' ~ repeat.item) }}"
    mode: single
  - id: ultimate_update_modbus_value
    alias: Power World Update modbus value
    # WRITES ONLY ON A USER CHANGE: the heat pump's memory chip wears with every
    # write. Conditions: a person changed the control in the UI (context.user_id),
    # so automations that sync the device to the display never write; the
    # device's current value has been read as a number; the register address is
    # known; and the new value differs.
    triggers:
      - entity_id:
          - input_select.work_mode
          - input_number.cooling_set_temperature
          - input_number.heating_set_temperature
          - input_number.hot_water_set_temperature
          - input_number.dhw_temperature_diff
          - input_number.heating_temperature_diff
          - input_number.vacation_set_temperature
        trigger: state
    conditions:
      - condition: template
        value_template: >
          {{ trigger.to_state is not none
            and trigger.from_state is not none
            and trigger.to_state.state not in ['unknown', 'unavailable', '', None]
            and (trigger.to_state.state | string) != ''
            and trigger.to_state.state != trigger.from_state.state
          }}
      - condition: template
        alias: Changed by a person in the UI, not by an automation
        value_template: '{{ trigger.to_state.context.user_id is not none }}'
    actions:
      - variables:
          sensor_id: sensor.{{ trigger.to_state.object_id }}
          is_select: "{{ 'input_select' in trigger.to_state.entity_id }}"
          new_value: "{% if is_select %}{{ state_attr(trigger.to_state.entity_id, 'options').index(trigger.to_state.state) }}{% else %}{{ trigger.to_state.state | float(none) }}{% endif %}"
          old_value: "{{ states(sensor_id) | float(none) }}"
          address: "{{ state_attr(sensor_id, 'address') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ new_value is number and old_value is number
                     and address is number
                     and (new_value | float - old_value | float) | abs > 0.01 }}
            sequence:
              - action: modbus.write_register
                data:
                  address: '{{ address }}'
                  hub: ultimate
                  unit: 1
                  value: '{{ new_value | round(0) | int }}'
    mode: queued
    max: 20
