input_boolean:
  vacation_mode:
    icon: mdi:airplane
    initial: false
    name: Vacation mode
input_number:
  cooling_set_temperature:
    icon: mdi:snowflake
    max: 30
    min: 7
    mode: slider
    name: Cooling Temperature
    step: 1
    unit_of_measurement: "\xB0C"
  dhw_temperature_diff:
    icon: mdi:thermometer
    max: 18
    min: 2
    mode: slider
    name: DHW temperature diff
    step: 1
    unit_of_measurement: "\xB0C"
  heating_temperature_diff:
    icon: mdi:thermometer
    max: 18
    min: 2
    mode: slider
    name: Heating temperature diff
    step: 1
    unit_of_measurement: "\xB0C"
  heating_set_temperature:
    icon: mdi:heat-wave
    max: 55
    min: 15
    mode: slider
    name: Heating Temperature
    step: 1
    unit_of_measurement: "\xB0C"
  hot_water_set_temperature:
    icon: mdi:shower-head
    max: 55
    min: 28
    mode: slider
    name: Hot Water Temperature
    step: 1
    unit_of_measurement: "\xB0C"
  vacation_set_temperature:
    icon: mdi:thermometer
    max: 55
    min: 15
    mode: slider
    name: Vacation Temp
    step: 1
    unit_of_measurement: "\xB0C"

input_select:
  operation_mode:
    icon: mdi:format-list-bulleted
    name: Operation Mode
    options:
    - Smart
    - Powerful
    - Silent
  work_mode:
    icon: mdi:format-list-bulleted
    name: Work Mode
    options:
    - DHW
    - Heating
    - Cooling
    - DHW+Heating
    - DHW+Cooling


template:
  # Binary sensors
  - binary_sensor:

      - name: "Compressor"
        unique_id: compressor
        icon: mdi:engine
        state: >-
          {% set v = state_attr('sensor.output_flag_1_map','compressor') %}
          {{ v in ['on','1',1,True] }}

      - name: "AC input overcurrent"
        unique_id: ac_input_overcurrent
