        address:  0x0109
        slave: 1
        data_type: int16
        scan_interval: 10
        precision: 0
        input_type: holding
        device_class: power_factor
        state_class: measurement
        unit_of_measurement: "%"
        unique_id: "f8_minimum_rotation_speed_of_dc_waterpump"  
