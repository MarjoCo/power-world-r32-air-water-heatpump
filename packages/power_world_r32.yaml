        unique_id: p15_defrosting_environment_and_evaporator_coil_temp_difference
      - name: "P16 Ambient temp for defrosting"
        scan_interval: 10
        address:  0x0097
        slave: 1
        input_type: holding
        scale: 1
        precision: 0
