# Power World R32 air-water heat pump — Home Assistant package
#
# One file: Modbus connection, sensors, helpers, automations and customize.
# Before use, set your converter's IP address in the modbus: section below
# (search for CHANGE). See README.md for the full installation guide.
#
# WARNING: the heat pump stores every written parameter in flash memory,
# which wears out with too many writes. The automations below write to the
# device ONLY when a person changes a value in the UI, and only when the
# value differs from what the device already has. Do not add automations
# that write to the heat pump periodically.

modbus:
  - name: ultimate
    type: tcp
    host: 192.168.1.100   # <-- CHANGE: IP address of your RS485-to-TCP converter
    port: 502            # <-- CHANGE if your converter uses another port
    delay: 1
    sensors:
      - name: "Parameter Flags 1"
        address: 0x0000
        data_type: int16
        input_type: holding
        slave: 1
        precision: 0
        scan_interval: 10
        state_class: measurement
        unique_id: "parameter_flags_1"
      - name: "control_flags_1"
        address: 0x0001
        data_type: int16
        input_type: holding
        slave: 1
        precision: 0
        scan_interval: 10
        state_class: measurement
        unique_id: "control_flags_1"
      - name: "control_flags_2"
        address: 0x0002
        data_type: int16
        input_type: holding
        slave: 1
        precision: 0
        scan_interval: 10
        state_class: measurement
        unique_id: "control_flags_2"
      - name: "Work Mode"
        address: 0x0004
        slave: 1
        scan_interval: 10
        precision: 0
        input_type: holding
        state_class: measurement
        unique_id: "work_mode"
      - name: "P9 Defrosting frequency"
        address: 0x0005
        slave: 1
        data_type: int16
        scan_interval: 10
        precision: 0
        input_type: holding
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
        unique_id: "defrosting frequency"  
      - name: "P10 Defrosting period"
        address: 0x0006
        slave: 1
        data_type: int16
        scan_interval: 10
        precision: 0
        input_type: holding
        unit_of_measurement: min
        state_class: measurement
        device_class: duration
        unique_id: "defrosting period"
      - name: "P12 Defrosting time"
        address: 0x0007
        slave: 1
        data_type: int16
        scan_interval: 10
        precision: 0
        input_type: holding
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        unique_id: "defrosting time" 
      - name: "A01 main expansion valve action cycle"
        address: 0x0008
        slave: 1
        data_type: int16
        scan_interval: 10
        precision: 0
        input_type: holding
        device_class: duration
        unit_of_measurement: s
        state_class: measurement
        unique_id: "main_expansion_valve_action_cycle"  
      - name: "A14 heating main valve initial opening 00"
        address: 0x0009
        slave: 1
        data_type: int16
        scan_interval: 10
        precision: 0
        scale: 2
        input_type: holding
        state_class: measurement
        unique_id: "heating_main_valve_initial_opening_00"    
      - name: "A15 heating main valve initial opening 01"
        address: 0x000A
        slave: 1
        data_type: int16
        scan_interval: 10
        precision: 0
        scale: 1
        input_type: holding
        state_class: measurement
        unique_id: "heating_main_valve_initial_opening_01"   
      - name: "Water Inlet Temperature"
        scan_interval: 10
        address: 32782
        slave: 1
        input_type: holding
        scale: 0.1
        precision: 1
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        unique_id: water_inlet_temp
      - name: "Water Tank Temperature"
        scan_interval: 10
        address: 32783
