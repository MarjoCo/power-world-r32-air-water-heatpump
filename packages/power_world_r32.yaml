        address:  0x010B
        slave: 1
        data_type: int16
        scan_interval: 10
        precision: 0
        input_type: holding
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        unique_id: "set_temp_diff_inlet_outlet_water"  
      - name: "eHeating turn on temp"
        address:  0x00ED
        slave: 1
        data_type: int16
        scan_interval: 10
        precision: 0
        input_type: holding
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        unique_id: "eheating_start_temp"
      # P27 (0x00FE): compressor run time before the electric heater may start.
      # Per the manual, the auxiliary heater (sensor.aux_eheating) also needs this
      # time to pass. Read-only, read rarely (the setting is only changed by hand).
      - name: "eHeating compressor run before start"
        address: 0x00FE
        slave: 1
        data_type: int16
        scan_interval: 600
        precision: 0
        input_type: holding
        unit_of_measurement: "min"
        state_class: measurement
        unique_id: "eheating_compressor_run_before_start"



      - name: "Auxiliary electronic expansion valve"
        address: 32797
        input_type: holding
        precision: 0
        scan_interval: 10
        slave: 1
        state_class: measurement
        unique_id: auxiliary_electronic_expansion_valve




    # The on/off switch is a template switch in the template: section below,
