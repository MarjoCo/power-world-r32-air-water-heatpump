        precision: 0
        input_type: holding
        device_class: enum
        unique_id: "low_8bits_inverter_fault"
      - name: "high 8bit inverter fault"
        address: 0x8020
        slave: 1
        data_type: int16
        scan_interval: 5
        precision: 0
        input_type: holding
        device_class: enum
        unique_id: "high_8bits_inverter_fault"
