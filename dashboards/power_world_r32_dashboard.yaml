# Power World R32 air-water heat pump — dashboard
# See README.md, step 5. Requires card-mod, multiple-logbook-card and
# history-explorer-card from HACS.
views:
  - type: panel
    path: ''
    cards:
      - type: custom:mod-card
        card:
          type: picture-elements
          image: /local/power_world_r32/heat_pump.png
          style:
            max-width: 100vw
            max-height: 100vh
            object-fit: contain
          elements:
            - type: state-label
              entity: sensor.water_outlet_temperature
              prefix: 'Water Out: '
              style:
                left: 80%
                top: 60%
                color: black
                transform: translate(-100%, -50%) scale(1, 1)
                font-size: var(--font-size)
            - type: state-label
              entity: sensor.water_inlet_temperature
              prefix: 'Water In: '
              style:
                left: 80%
                top: 65%
                color: black
                transform: translate(-100%, -50%) scale(1, 1)
                font-size: var(--font-size)
            - type: state-label
              entity: sensor.actual_frequency
              prefix: 'Frequency: '
              style:
                left: 80%
                top: 75%
                transform: translate(-100%, -50%) scale(1, 1)
                color: black
                font-size: var(--font-size)
            - type: state-label
              entity: sensor.water_tank_temperature
              prefix: 'Tank temp: '
              style:
                left: 80%
                top: 70%
                color: black
                transform: translate(-100%, -50%) scale(1, 1)
                font-size: var(--font-size)
            - type: state-label
              entity: sensor.ambient_temperature
              style:
                left: 49%
                top: 15%
                color: black
                transform: translate(-40%, -50%) scale(1, 1)
                font-size: var(--font-size)
            - type: state-label
              entity: input_select.work_mode
              style:
                left: 46%
                top: 60%
                color: black
                transform: translate(-100%, -50%) scale(1, 1)
                font-size: var(--font-size)
            - type: state-label
              entity: input_select.operation_mode
              style:
                left: 46%
                top: 65%
                color: black
                transform: translate(-100%, -50%) scale(1, 1)
                font-size: var(--font-size)
            - type: conditional
              conditions:
                - entity: sensor.work_mode
                  state: '1'
              elements:
                - type: state-label
                  entity: input_number.heating_set_temperature
                  prefix: 'Heating set: '
                  style:
                    left: 46%
                    top: 70%
                    color: black
                    transform: translate(-100%, -50%) scale(1, 1)
                    font-size: var(--font-size)
            - type: conditional
              conditions:
                - entity: sensor.work_mode
                  state: '3'
              elements:
                - type: state-label
                  entity: input_number.heating_set_temperature
                  prefix: 'Heating set: '
                  style:
                    left: 46%
                    top: 70%
                    color: black
                    transform: translate(-100%, -50%) scale(1, 1)
                    font-size: var(--font-size)
            - type: conditional
              conditions:
                - entity: sensor.work_mode
                  state: '0'
              elements:
                - type: state-label
                  entity: input_number.hot_water_set_temperature
                  prefix: 'DHW set: '
                  style:
                    left: 46%
                    top: 75%
                    color: black
                    transform: translate(-100%, -50%) scale(1, 1)
                    font-size: var(--font-size)
            - type: conditional
              conditions:
                - entity: sensor.work_mode
                  state: '3'
              elements:
                - type: state-label
                  entity: input_number.hot_water_set_temperature
                  prefix: 'DHW set: '
                  style:
                    left: 46%
                    top: 75%
                    color: black
                    transform: translate(-100%, -50%) scale(1, 1)
                    font-size: var(--font-size)
            - type: conditional
              conditions:
                - entity: sensor.work_mode
                  state: '4'
              elements:
                - type: state-label
                  entity: input_number.hot_water_set_temperature
                  prefix: 'DHW set: '
                  style:
                    left: 46%
                    top: 75%
                    color: black
                    transform: translate(-100%, -50%) scale(1, 1)
                    font-size: var(--font-size)
            - type: conditional
              conditions:
                - entity: sensor.work_mode
                  state: '2'
              elements:
                - type: state-label
                  entity: input_number.cooling_set_temperature
                  prefix: 'Cooling set: '
                  style:
                    left: 46%
                    top: 80%
                    color: black
                    transform: translate(-100%, -50%) scale(1, 1)
                    font-size: var(--font-size)
            - type: conditional
              conditions:
                - entity: sensor.work_mode
                  state: '4'
              elements:
                - type: state-label
                  entity: input_number.cooling_set_temperature
                  prefix: 'Cooling set: '
                  style:
                    left: 46%
                    top: 80%
                    color: black
                    transform: translate(-100%, -50%) scale(1, 1)
                    font-size: var(--font-size)
            - type: conditional
              conditions:
                - entity: binary_sensor.level_1_anti_freeze
                  state: 'on'
              elements:
                - type: state-icon
                  entity: binary_sensor.level_1_anti_freeze
                  style:
                    left: 85%
                    top: 20%
                    color: black
                    transform: translate(-40%, -40%) scale(4vh, 4vh)
            - entity: input_boolean.vacation_mode
              type: state-icon
              style:
                left: 85%
                top: 13%
                transform: translate(-40%, -40%) scale(4vh, 4vh)
            - type: state-icon
              entity: binary_sensor.heating
              icon: mdi:weather-sunny
              style:
                top: 83%
                left: 30%
                transform: translate(-50%, -50%) scale(4vh, 4vh)
            - type: state-icon
              entity: binary_sensor.domestic_hot_water
              icon: mdi:shower-head
              style:
                top: 83%
                left: 40%
                transform: translate(-50%, -50%) scale(4vh, 4vh)
            - type: state-icon
              entity: binary_sensor.defrosting
              icon: mdi:snowflake-melt
              style:
                left: 50%
                top: 83%
                transform: translate(-50%, -50%) scale(4vh, 4vh)
            - type: state-icon
              entity: binary_sensor.compressor
              icon: mdi:engine
              style:
                left: 60%
                top: 83%
                transform: translate(-50%, -50%) scale(4vh, 4vh)
            - type: state-icon
              entity: binary_sensor.fans
              icon: mdi:fan
              style:
                left: 70%
                top: 83%
                transform: translate(-50%, -50%) scale(4vh, 4vh)
            - type: conditional
              conditions:
                - entity: binary_sensor.heat_pump_fault
                  state: 'on'
              elements:
                - type: state-label
                  entity: binary_sensor.heat_pump_fault
                  attribute: latest
                  style:
                    left: 50%
                    top: 90%
                    color: red
                    transform: translate(-50%, -50%) scale(1, 1)
        card_mod:
          style: >
            ha-card {
              position: relative;
              max-width: 1024px;  # Maximum width for large screens
              max-height: 1024px;  # Maximum height for large screens
              --font-size: 1.2rem;  # Default font size
              overflow: hidden;  # Hide scrollbars on the card
            }


            .element {
              position: absolute;
            }


            @media (orientation: landscape) {
              ha-card {
                --font-size: 1.2rem;
              }
            }


            @media (orientation: portrait) {
              ha-card {
                --font-size: 0.8rem;
              }
            }


            @media (max-width: 600px) {
              ha-card {
                --font-size: 0.8rem;  # Font size for small screens
              }
            }


            /* Fullscreen or Kiosk mode on small screens (width <= 600px) */


            @media (min-width: 0px) and (max-width: 600px) and (display-mode:
            fullscreen), (min-width: 0px) and (max-width: 600px) and (display-mode: standalone) {
              ha-card {
                width: 100vw;  # Set width to the viewport width
                height: 100vh;  # Set height to the viewport height
                max-width: 100vw;  # Ensure max-width is 100% of the viewport width
                max-height: 100vh;  # Ensure max-height is 100% of the viewport height
              }
              img {
                width: 100vw;  # Set image width to 100% of viewport width
                height: 100vh;  # Set image height to 100% of viewport height
                object-fit: contain;  # Ensures image fits without distortion
              }
            }


            /* Hide Scrollbars for the entire page */

            html, body {
              overflow: hidden;  # Disable scrolling for the whole page
              margin: 0;  # Remove margin to ensure full usage of the screen
              padding: 0;  # Remove padding to ensure full usage of the screen
            }


            /* Additional rule for the page container to remove scrollbars */

            .content {
              overflow: hidden !important;  # Ensure no scrollbars on the container
            }
